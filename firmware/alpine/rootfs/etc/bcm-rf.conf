# /etc/bcm-rf.conf — Single Source of Truth for HG6371F RF & PHY tuning.
# SSIDs, passphrases, channels, and roaming live solely in /etc/hostapd/wl{0,1}.conf.

WL0_ENABLED=1
WL0_WIDTH=20
WL0_HE=0
WL0_TXPWR_PCT=100
WL0_ASSOC_RSSI_TH=0
WL0_APSD=0
WL0_GUEST_VLAN=0

WL1_ENABLED=1
WL1_WIDTH=160
WL1_HE=1
WL1_TXPWR_PCT=100
WL1_ASSOC_RSSI_TH=0
WL1_APSD=1
WL1_TWT=1
WL1_ATF=0
WL1_GUEST_VLAN=0

TUNE_FRAMEBURST=1
TUNE_AMPDU_RTS=0
TUNE_PHY_RXDESENS=15
