# Alpine HG6371F AP dhcpcd configuration.
# Fast-boot tuned: skip RFC 5227 ARP probing (noarp) and fork immediately
# (background) so OpenRC starts hostapd/sshd/ap-panel without a ~14s stall.

duid
persistent
vendorclassid

option domain_name_servers, domain_name, domain_search
option classless_static_routes
option interface_mtu
option host_name
option rapid_commit

require dhcp_server_identifier
slaac private

noarp
background
